<div class="topbar-container">

  <div>

    <h3 class="m-0">
      Welcome back,
      {{ userName }}
    </h3>

    <small class="subtitle">
      Ready to write today?
    </small>

  </div>

  <div class="avatar-area">

    <p-avatar
      [image]="avatarUrl"
      shape="circle"
      size="large"
      styleClass="avatar-button"
      (click)="toggleMenu($event)"
    />

    <p-menu
      #menu
      [model]="menuItems"
      [popup]="true"
      appendTo="body"
    />

  </div>

</div>
