<div class="auth-page">

  <div class="forge-glow"></div>

  <p-card styleClass="auth-card">

    <div class="text-center mb-5">

      <div class="brand-icon">
        ⚒
      </div>

      <h1 class="brand-title">
        Booksmith AI
      </h1>

      <p class="brand-subtitle">
        Forge stories powered by AI
      </p>

    </div>

    <form
      (ngSubmit)="loginWithForm()"
      class="p-fluid"
    >

      <!-- Email -->

      <div class="field">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          name="email"
          type="email"
          pInputText
          required
          [(ngModel)]="email"
        />

      </div>

      <!-- Password -->

      <div class="field mt-3">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          name="password"
          type="password"
          pInputText
          required
          [(ngModel)]="password"
        />

      </div>

      <!-- Forgot -->

      <div class="forgot-container">

        <a
          routerLink="/forgot-password"
        >
          Forgot password?
        </a>

      </div>

      <!-- Login -->

      <div class="mt-4 login-container">

        <p-button
          label="Sign in"
          type="submit"
          styleClass="w-full auth-btn"
        />

      </div>

    </form>

    <!-- Divider -->

    <div class="divider">

      <span>
        OR
      </span>

    </div>

    <!-- Google -->
    <div class="google-login-container">
    <p-button
      label="Continue with Google"
      icon="pi pi-google"
      styleClass="w-full google-btn"
      (onClick)="loginWithGoogle()"
    />
  </div>
    <!-- Register -->

    <div class="register-link">

      <span>
        New here?
      </span>

      <a routerLink="/register">
        Create account
      </a>

    </div>

  </p-card>

</div>
