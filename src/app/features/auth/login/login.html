<div class="auth-page">
  <div class="forge-glow"></div>

  <div class="auth-card">
    <div class="brand">
      <div class="brand-icon">⚒</div>
      <h1 class="brand-title">Booksmith AI</h1>
      <p class="brand-subtitle">Forje suas histórias, do primeiro personagem ao livro pronto</p>
    </div>

    @if (googleError(); as text) {
      <p-message severity="error" [text]="text" styleClass="mb-3" />
    }
    @if (message(); as text) {
      <p-message severity="error" [text]="text" />
    }

    <form class="form" (ngSubmit)="loginWithForm()" #form="ngForm">
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" pInputText required autocomplete="email" inputmode="email"
          [(ngModel)]="email" />
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" pInputText required autocomplete="current-password"
          [(ngModel)]="password" />
      </div>

      <div class="link-row">
        <a routerLink="/forgot-password">Esqueceu a senha?</a>
      </div>

      <p-button label="Entrar" type="submit" styleClass="full-width" [loading]="loading()"
        [disabled]="form.invalid ?? true" />
    </form>

    <div class="divider"><span>OU</span></div>

    <div class="google-btn">
      <p-button label="Continuar com Google" icon="pi pi-google" styleClass="full-width" (onClick)="loginWithGoogle()" />
    </div>

    <div class="footer-link">
      <span>Primeira vez aqui? </span>
      <a routerLink="/register">Criar conta</a>
    </div>
  </div>
</div>
