<div class="forgot-page">

  <div class="forgot-container">

    <p-card styleClass="forgot-card">

      <div class="text-center mb-5">

        <h1 class="brand-title mb-2">
          Forgot password
        </h1>

        <p class="brand-subtitle m-0">
          Enter your email and we’ll send
          you a password reset link
        </p>

      </div>

      <form
        [formGroup]="forgotForm"
        (ngSubmit)="submit()"
        class="forgot-form"
      >

        <div class="field">

          <p-floatlabel variant="in">

            <input
              pInputText
              type="email"
              inputId="email"
              formControlName="email"
              class="w-full"
            />

            <label for="email">
              Email
            </label>

          </p-floatlabel>

          @if (
            form['email'].invalid &&
            form['email'].touched
          ) {

            <small class="error-text">
              Please enter a valid email
            </small>

          }

        </div>

        <div class="button-wrapper">

          <p-button
            type="submit"
            label="Send reset link"
            icon="pi pi-send"
            [loading]="loading"
          />

        </div>

      </form>

      @if (successMessage) {

        <div class="success-box mt-4">

          <i class="pi pi-check-circle"></i>

          <span>
            {{ successMessage }}
          </span>

        </div>

      }

      <div class="text-center mt-4">

        <a
          routerLink="/login"
          class="login-link"
        >
          ← Back to Sign in
        </a>

      </div>

    </p-card>

  </div>

</div>
