<div
  class="flex justify-content-center align-items-center min-h-screen p-4"
>
  <p-card
    styleClass="w-full md:w-30rem"
  >

    <div class="text-center mb-5">

      <h1 class="mb-2">
        Forgot Password
      </h1>

      <p class="text-500 m-0">
        Enter your email and we'll
        send you a reset link
      </p>

    </div>

    @if (!success) {

      <form
        [formGroup]="form"
        (ngSubmit)="sendResetLink()"
        class="flex flex-column gap-4"
      >

        <div>

          <label
            class="block mb-2"
          >
            Email
          </label>

          <input
            pInputText
            type="email"
            formControlName="email"
            class="w-full"
          />

          @if (
            controls['email']
              .invalid &&
            controls['email']
              .touched
          ) {
            <small
              class="text-red-500"
            >
              Enter a valid email
            </small>
          }

        </div>

        <p-button
          type="submit"
          label="Send Reset Link"
          icon="pi pi-send"
          styleClass="w-full"
          [loading]="loading"
        />

      </form>

    } @else {

      <div
        class="text-center"
      >

        <i
          class="pi pi-check-circle text-5xl text-green-500"
        ></i>

        <h3 class="mt-4">
          Email sent
        </h3>

        <p class="text-500">
          Check your inbox for
          reset instructions
        </p>

      </div>
    }

    <div
      class="text-center mt-4"
    >

      <a
        routerLink="/login"
        class="no-underline"
      >
        Back to Login
      </a>

    </div>

  </p-card>
</div>
