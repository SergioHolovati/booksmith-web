<div class="max-w-4xl mx-auto">
  <div class="mb-5">
    <h1>Create Book</h1>
    <p class="text-500">
      Start your next masterpiece
    </p>
  </div>

  <p-card>
    <div class="flex flex-column gap-4">

      <div>
        <label class="block mb-2">
          Title
        </label>

        <input
          pInputText
          [(ngModel)]="title"
          class="w-full"
          placeholder="The Last Mage"
        />
      </div>

      <div>
        <label class="block mb-2">
          Description
        </label>

        <textarea
          pTextarea
          [(ngModel)]="description"
          rows="6"
          class="w-full"
          placeholder="Tell readers about your book..."
        ></textarea>
      </div>

      <div class="flex justify-content-end">
        <p-button
          label="Create Book"
          icon="pi pi-check"
          (onClick)="createBook()">
        </p-button>
      </div>

    </div>
  </p-card>
</div>
