<!doctype html>
<html lang="pt-BR" class="app-dark">
<head>
  <meta charset="utf-8">
  <!-- CSP: só roda script do próprio Booksmith (nada inline, nada de outro site). Se uma falha deixar entrar HTML
       de fora, o script dele não roda. Estilo inline fica liberado (o PrimeNG usa); imagens vêm do armazenamento
       de imagens (https). Em produção, o servidor também manda a política no cabeçalho (frame-ancestors). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Booksmith</title>
  <base href="/">
  <!-- viewport-fit=cover: o layout usa safe-area-inset para notch e barra de gestos -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="Escreva sua história, fanfic ou original, sem furos.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Booksmith">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <app-root></app-root>
  <noscript>Ative o JavaScript para usar o Booksmith.</noscript>
</body>
</html>
